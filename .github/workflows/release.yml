name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: Build and create draft Windows release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo package version' }
          $version = ($metadata.packages | Where-Object name -eq 'viper-tray').version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match Cargo version v$version"
          }
      - name: Build release executable
        run: cargo build --release --locked
      - name: Package portable downloads
        run: ./scripts/package.ps1
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ViperTray-${{ github.ref_name }}-windows-x64
          path: |
            dist/viper-tray.exe
            dist/ViperTray-windows-x64.zip
            dist/viper-tray-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @('dist/viper-tray.exe', 'dist/ViperTray-windows-x64.zip', 'dist/viper-tray-source.zip', 'dist/SHA256SUMS.txt')
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw 'This release is already published; refusing to replace its assets'
            }
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "Viper Tray $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the draft release' }
