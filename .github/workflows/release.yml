name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: Check, build, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo package version' }
          $version = ($metadata.packages | Where-Object name -eq 'viper-tray').version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match Cargo version v$version"
          }
      - name: Install check components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run software tests
        run: cargo test --locked
      - name: Check warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release executable
        run: cargo build --release --locked
      - name: Package portable downloads
        run: ./scripts/package.ps1
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ViperTray-${{ github.ref_name }}-windows-x64
          path: dist/ViperTray-windows-x64.zip
          if-no-files-found: error
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @('dist/ViperTray-windows-x64.zip')
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw 'This release is already published; refusing to replace its assets'
            }
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload the replacement ZIP' }
            gh release edit $env:RELEASE_TAG --notes-file docs/release-notes.md
          } else {
            gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "Viper-Tray $env:RELEASE_TAG" --notes-file docs/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the draft release' }
      - name: Verify downloads and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect release assets' }
          if ($release.assets.Count -ne 1 -or $release.assets[0].name -cne 'ViperTray-windows-x64.zip') {
            throw 'Release must contain only ViperTray-windows-x64.zip'
          }
          $downloadPath = Join-Path $env:RUNNER_TEMP 'verify-release'
          gh release download $env:RELEASE_TAG --dir $downloadPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not download release assets for verification' }
          foreach ($name in @('ViperTray-windows-x64.zip')) {
            $local = (Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash
            $uploaded = (Get-FileHash -LiteralPath (Join-Path $downloadPath $name) -Algorithm SHA256).Hash
            if ($local -cne $uploaded) { throw "Uploaded asset checksum mismatch: $name" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified release' }
